[workspace]
resolver = "3"
members = ["crates/fluxer-core", "crates/fluxer-gui", "crates/fluxer-voice"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Fluxer-rs contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rusqlite = { version = "0.40", features = ["bundled"] }
webrtc = "0.21"
rtc = "0.21"
livekit-signaling = { version = "0.1.7", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
livekit-protocol = "0.8.2"
rusty-opus = "1.0"
libloading = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
